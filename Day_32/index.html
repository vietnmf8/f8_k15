    <body>
        <!-- root -->
        <div id="root"></div>

        <!-- CDN -->
        <script
            crossorigin
            src="https://unpkg.com/react@18/umd/react.development.js"
        ></script>
        <script
            crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
        ></script>

        <!-- Babel -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
        <script type="text/babel">
            const heading = 'Todo List'

            const wrapper = (
                <div>
                    <h1>{heading}</h1>
                    <ul className="tasks-list">
                        <li className="task-item" title="Item 1">
                            <a href="/tasks/1" className="task-link">
                                Item 1
                            </a>
                        </li>
                        <li className="task-item" title="Item 2">
                            <a href="/tasks/2" className="task-link">
                                Item 2
                            </a>
                        </li>
                        <li className="task-item" title="Item 3">
                            <a href="/tasks/3" className="task-link">
                                Item 1
                            </a>
                        </li>
                    </ul>
                </div>
            );

            const root = ReactDOM.createRoot(document.querySelector("#root"));
            root.render(wrapper);
        </script>
